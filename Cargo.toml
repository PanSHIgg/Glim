[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
# 界面统一通过 gpui-kit 使用 GPUI。
gpui-kit = "0.7.3"

# 终端引擎使用 Zed 维护的 Alacritty fork，固定 revision。
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }

# 通用小依赖。
bitflags = "2"
futures = "0.3"
# 进程信息：子进程检测（关闭确认）与工作目录查询（分屏继承）。
sysinfo = "0.31"
# 配置与工作区持久化：TOML 文档与结构序列化。
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# 平台数据目录：Windows `%APPDATA%`、macOS Application Support、Linux XDG。
dirs = "6"
# Windows：构建脚本把图标与版本信息编译进 exe 资源（`crates/glim/build.rs`）。
embed-resource = "3"

# 内部 crate，依赖方向见各 crate 的 Cargo.toml。
glim_settings = { path = "crates/glim_settings" }
glim_terminal = { path = "crates/glim_terminal" }
glim_terminal_view = { path = "crates/glim_terminal_view" }
glim_ui = { path = "crates/glim_ui" }
glim_workspace = { path = "crates/glim_workspace" }
