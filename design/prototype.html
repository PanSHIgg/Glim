<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Glim · 终端设计</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./prototype.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-glim" viewBox="0 0 24 24"><path d="m5 6 6 6-6 6M14 18h5"/></symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
    <symbol id="icon-stack" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></symbol>
    <symbol id="icon-layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16M14 12h7"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="icon-restore" viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M15 20v-5h5M9 20v-5H4"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5l1.5 1.5M19 5l-1.5 1.5M6.5 17.5 5 19"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14a9 9 0 0 1-10.5-10.5A9 9 0 1 0 20.5 14Z"/></symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="icon-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M18 8a8 8 0 0 1-8 8H6"/></symbol>
    <symbol id="icon-swap" viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="icon-grip" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/></symbol>
  </svg>

  <main class="design-sheet">
    <header class="sheet-header">
      <div class="sheet-identity"><span class="sheet-name">Glim</span><span class="sheet-divider"></span><span>终端 · 界面原型</span></div>
    </header>

    <section class="app" id="app" aria-label="Glim 终端窗口">
      <header class="titlebar">
        <div class="brand" aria-label="Glim"><svg class="icon brand-icon"><use href="#icon-glim"/></svg><span>Glim</span></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="终端标签页"></div>
        <button class="icon-button tab-add" id="tabAdd" type="button" aria-label="新建标签页" title="新建标签页 · Ctrl+Shift+T"><svg class="icon"><use href="#icon-plus"/></svg></button>
        <div class="titlebar-space"></div>
        <div class="toolbar" role="group" aria-label="窗格操作">
          <button class="toolbar-button" id="splitButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="splitMenu" title="分屏 · Ctrl+Shift+D / E"><svg class="icon"><use href="#icon-split"/></svg><span>分屏…</span></button>
          <button class="toolbar-button" id="layoutButton" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker" title="排列窗格 · Alt+Z"><svg class="icon"><use href="#icon-layout"/></svg><span>布局…</span></button>
        </div>
        <!-- 原生窗口装饰的示意，正式应用由平台 TitleBar 提供。 -->
        <div class="window-chrome" aria-hidden="true"><span class="chrome-minimize"></span><span class="chrome-maximize"></span><svg class="icon"><use href="#icon-close"/></svg></div>
      </header>

      <div class="workspace" id="workspace" role="tabpanel" aria-label="当前标签页的终端窗格" tabindex="-1">
        <div class="pane-layer" id="panes"></div>
        <div class="divider-layer" id="dividers"></div>
        <div class="drop-hint" id="dropHint"><svg class="icon"><use href="#icon-layout"/></svg><span>拖到这里，重新排列窗格</span></div>
        <div class="empty" id="empty" hidden>
          <svg class="empty-icon"><use href="#icon-glim"/></svg>
          <h1>从一个终端开始</h1>
          <p>打开终端，继续手头的工作。</p>
          <button class="default-button" id="newPaneButton" type="button"><svg class="icon"><use href="#icon-plus"/></svg>新建终端</button>
          <span class="empty-shortcut">新建标签页 <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd></span>
        </div>
      </div>

      <footer class="statusbar">
        <div class="status-context"><svg class="icon"><use href="#icon-terminal"/></svg><span id="statusPath">~/workspace/glim</span><span class="status-separator"></span><span id="statusShell">PowerShell</span></div>
        <div class="status-info">
          <span id="paneCount">3 个窗格</span><span class="status-separator"></span><span class="status-encoding">UTF-8</span><span class="status-separator"></span>
          <div class="theme-switch" id="themeSwitch" role="group" aria-label="主题">
            <button type="button" data-theme="light" aria-label="浅色" title="浅色" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-sun"/></svg></button>
            <button type="button" data-theme="dark" aria-label="深色" title="深色" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#icon-moon"/></svg></button>
            <button type="button" data-theme="system" aria-label="跟随系统" title="跟随系统" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-monitor"/></svg></button>
          </div>
        </div>
      </footer>

      <section class="picker overlay" id="picker" role="dialog" aria-label="排列窗格" hidden>
        <div class="overlay-header"><div><strong>排列窗格</strong><span id="pickerCount">3 个窗格</span></div><button class="icon-button" id="pickerClose" type="button" aria-label="关闭布局面板" title="关闭 · Esc"><svg class="icon"><use href="#icon-close"/></svg></button></div>
        <div class="templates" id="templates" role="group" aria-label="布局方案"></div>
        <div class="overlay-footer"><span>悬停预览，点击应用</span><span><kbd>Esc</kbd> 取消</span></div>
      </section>

      <div class="split-menu overlay" id="splitMenu" role="menu" aria-label="分屏" hidden>
        <button type="button" role="menuitem" data-axis="row"><svg class="icon"><use href="#icon-split"/></svg><span>向右分屏</span><kbd>Ctrl+Shift+D</kbd></button>
        <button type="button" role="menuitem" data-axis="col"><svg class="icon"><use href="#icon-stack"/></svg><span>向下分屏</span><kbd>Ctrl+Shift+E</kbd></button>
      </div>
    </section>

    <footer class="sheet-footer">
      <div class="review" id="review" role="group" aria-label="预览状态">
        <span class="review-label">预览</span>
        <button type="button" data-view="workspace" aria-pressed="true">工作区</button>
        <button type="button" data-view="layout" aria-pressed="false">布局面板</button>
        <button type="button" data-view="menu" aria-pressed="false">分屏菜单</button>
        <button type="button" data-view="swap" aria-pressed="false">交换预览</button>
        <button type="button" data-view="empty" aria-pressed="false">空状态</button>
      </div>
      <p class="interaction-note">拖动标题排列窗格 · 拖动分隔线调整大小 · <kbd>Alt</kbd> + <kbd>Z</kbd> 打开布局</p>
    </footer>
    <p class="prototype-note">交互设计预览，终端内容为示例</p>
  </main>
  <div class="drag-ghost overlay" id="ghost" aria-hidden="true" hidden></div>
  <div class="sr-only" id="announcement" aria-live="polite"></div>
</body>
</html>
